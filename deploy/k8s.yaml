apiVersion: apps/v1
kind: Deployment
metadata: { name: portfan, labels: { app: portfan } }
spec:
  replicas: 1
  selector: { matchLabels: { app: portfan } }
  template:
    metadata: { labels: { app: portfan } }
    spec:
      containers:
        - name: portfan
          image: ghcr.io/cognis-digital/portfan:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: portfan }
spec:
  selector: { app: portfan }
  ports: [{ port: 80, targetPort: 8000 }]
